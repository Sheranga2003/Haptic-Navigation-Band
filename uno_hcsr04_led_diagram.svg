<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#fafaf8"/>
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Arduino Uno + HC-SR04 + LED — Breadboard Prototype</text>

  <!-- Arduino Uno -->
  <rect x="50" y="90" width="200" height="420" rx="8" fill="#2b6cb0" stroke="#1a365d" stroke-width="2"/>
  <text x="150" y="115" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">Arduino Uno</text>

  <circle cx="250" cy="170" r="4" fill="#fff"/>
  <text x="260" y="174" font-size="13" fill="#1a1a1a">D9  → Trig</text>

  <circle cx="250" cy="210" r="4" fill="#fff"/>
  <text x="260" y="214" font-size="13" fill="#1a1a1a">D10 → Echo</text>

  <circle cx="250" cy="250" r="4" fill="#fff"/>
  <text x="260" y="254" font-size="13" fill="#1a1a1a">D6  → LED (+, via resistor)</text>

  <circle cx="250" cy="350" r="4" fill="#fff"/>
  <text x="260" y="354" font-size="13" fill="#1a1a1a">5V</text>

  <circle cx="250" cy="400" r="4" fill="#fff"/>
  <text x="260" y="404" font-size="13" fill="#1a1a1a">GND</text>

  <circle cx="250" cy="440" r="4" fill="#fff"/>
  <text x="260" y="444" font-size="13" fill="#1a1a1a">GND</text>

  <!-- Breadboard -->
  <rect x="480" y="90" width="360" height="440" rx="6" fill="#fdfdf5" stroke="#a0aec0" stroke-width="2"/>
  <text x="660" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a5568">Breadboard</text>

  <!-- power rails -->
  <line x1="500" y1="135" x2="820" y2="135" stroke="#e53e3e" stroke-width="2"/>
  <text x="825" y="139" font-size="11" fill="#e53e3e">+ rail (5V)</text>
  <line x1="500" y1="150" x2="820" y2="150" stroke="#2d3748" stroke-width="2"/>
  <text x="825" y="154" font-size="11" fill="#2d3748">− rail (GND)</text>

  <!-- HC-SR04 on breadboard -->
  <rect x="560" y="190" width="160" height="90" rx="6" fill="#e2e8f0" stroke="#4a5568" stroke-width="2"/>
  <text x="640" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">HC-SR04</text>
  <circle cx="585" cy="240" r="14" fill="#a0aec0" stroke="#4a5568"/>
  <circle cx="695" cy="240" r="14" fill="#a0aec0" stroke="#4a5568"/>
  <circle cx="575" cy="270" r="3.5" fill="#1a1a1a"/>
  <circle cx="605" cy="270" r="3.5" fill="#1a1a1a"/>
  <circle cx="655" cy="270" r="3.5" fill="#1a1a1a"/>
  <circle cx="685" cy="270" r="3.5" fill="#1a1a1a"/>
  <text x="640" y="292" text-anchor="middle" font-size="10" fill="#4a5568">VCC   Trig   Echo   GND</text>

  <!-- LED on breadboard -->
  <ellipse cx="620" cy="400" rx="20" ry="26" fill="#f56565" stroke="#742a2a" stroke-width="2"/>
  <text x="620" y="405" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">LED</text>
  <line x1="612" y1="426" x2="612" y2="450" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="628" y1="426" x2="628" y2="450" stroke="#1a1a1a" stroke-width="2"/>
  <text x="605" y="465" font-size="10" fill="#1a1a1a">−(short)</text>
  <text x="622" y="465" font-size="10" fill="#1a1a1a">+(long)</text>

  <!-- resistor -->
  <rect x="700" y="415" width="45" height="14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="722" y="410" text-anchor="middle" font-size="10" fill="#1a1a1a">220Ω</text>

  <!-- Wiring: Arduino to breadboard -->
  <path d="M250,170 L575,170 L575,270" stroke="#e53e3e" stroke-width="2" fill="none"/>
  <text x="330" y="163" font-size="11" fill="#e53e3e">D9 → Trig</text>

  <path d="M250,210 L655,210 L655,270" stroke="#3182ce" stroke-width="2" fill="none"/>
  <text x="330" y="230" font-size="11" fill="#3182ce">D10 ← Echo</text>

  <path d="M250,250 L745,250 L745,422" stroke="#d69e2e" stroke-width="2" fill="none"/>
  <text x="330" y="243" font-size="11" fill="#d69e2e">D6 → resistor → LED(+)</text>

  <path d="M250,350 L500,350 L500,135" stroke="#c53030" stroke-width="2" fill="none"/>
  <text x="330" y="345" font-size="11" fill="#c53030">5V → + rail</text>

  <path d="M500,135 L605,135 L605,270" stroke="#c53030" stroke-width="2" fill="none"/>

  <path d="M250,400 L500,400 L500,150" stroke="#2d3748" stroke-width="2" fill="none"/>
  <text x="330" y="415" font-size="11" fill="#2d3748">GND → − rail</text>

  <path d="M500,150 L685,150 L685,270" stroke="#2d3748" stroke-width="2" fill="none"/>
  <path d="M612,450 L612,460 L500,460 L500,150" stroke="#2d3748" stroke-width="2" fill="none"/>

  <!-- LED to resistor to D6 -->
  <path d="M628,415 L628,422 L700,422" stroke="#d69e2e" stroke-width="2" fill="none"/>

  <!-- Legend / notes -->
  <rect x="50" y="530" width="800" height="60" rx="6" fill="#fff" stroke="#cbd5e0" stroke-width="1"/>
  <text x="65" y="550" font-size="12.5" font-weight="bold" fill="#1a1a1a">Resistor for LED:</text>
  <text x="65" y="568" font-size="12" fill="#4a5568">220Ω resistor in series with the LED's long leg (anode). Short leg (cathode) goes straight to GND rail.</text>
  <text x="65" y="583" font-size="11.5" fill="#4a5568">(5V − ~2V LED drop) ÷ 0.02A ≈ 150Ω minimum — 220Ω is the safe standard value and works fine.</text>
</svg>
