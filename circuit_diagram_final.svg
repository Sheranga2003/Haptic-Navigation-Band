<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="750" fill="#fafaf8"/>
  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Haptic Navigation Band — Final Circuit</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#4a5568">Arduino Nano + TF-Luna LiDAR (I2C) + Vibration Motor Driver</text>

  <!-- Arduino Nano -->
  <rect x="50" y="100" width="160" height="440" rx="8" fill="#2b6cb0" stroke="#1a365d" stroke-width="2"/>
  <text x="130" y="125" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">Arduino Nano</text>

  <circle cx="210" cy="165" r="4" fill="#fff"/>
  <text x="220" y="169" font-size="12" fill="#1a1a1a">A4 (SDA)</text>

  <circle cx="210" cy="200" r="4" fill="#fff"/>
  <text x="220" y="204" font-size="12" fill="#1a1a1a">A5 (SCL)</text>

  <circle cx="210" cy="300" r="4" fill="#fff"/>
  <text x="220" y="304" font-size="12" fill="#1a1a1a">D6 (PWM to motor)</text>

  <circle cx="210" cy="380" r="4" fill="#fff"/>
  <text x="220" y="384" font-size="12" fill="#1a1a1a">5V</text>

  <circle cx="210" cy="420" r="4" fill="#fff"/>
  <text x="220" y="424" font-size="12" fill="#1a1a1a">GND</text>

  <circle cx="210" cy="460" r="4" fill="#fff"/>
  <text x="220" y="464" font-size="12" fill="#1a1a1a">GND</text>

  <circle cx="210" cy="500" r="4" fill="#fff"/>
  <text x="220" y="504" font-size="12" fill="#1a1a1a">GND</text>

  <!-- TF-Luna sensor board with confirmed pinout -->
  <rect x="440" y="90" width="240" height="170" rx="6" fill="#e2e8f0" stroke="#4a5568" stroke-width="2"/>
  <text x="560" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">TF-Luna LiDAR</text>
  <text x="560" y="132" text-anchor="middle" font-size="11" fill="#4a5568">I2C mode (confirmed pinout)</text>
  <rect x="480" y="145" width="160" height="45" rx="4" fill="#2d3748"/>
  <circle cx="500" cy="167" r="8" fill="#1a202c"/>
  <circle cx="620" cy="167" r="8" fill="#1a202c"/>

  <circle cx="460" cy="230" r="4" fill="#1a1a1a"/>
  <circle cx="495" cy="230" r="4" fill="#1a1a1a"/>
  <circle cx="530" cy="230" r="4" fill="#1a1a1a"/>
  <circle cx="565" cy="230" r="4" fill="#1a1a1a"/>
  <circle cx="600" cy="230" r="4" fill="#1a1a1a"/>
  <circle cx="635" cy="230" r="4" fill="#1a1a1a"/>
  <text x="460" y="245" text-anchor="middle" font-size="8" fill="#4a5568">Pin1</text>
  <text x="495" y="245" text-anchor="middle" font-size="8" fill="#4a5568">Pin2</text>
  <text x="530" y="245" text-anchor="middle" font-size="8" fill="#4a5568">Pin3</text>
  <text x="565" y="245" text-anchor="middle" font-size="8" fill="#4a5568">Pin4</text>
  <text x="600" y="245" text-anchor="middle" font-size="8" fill="#4a5568">Pin5</text>
  <text x="635" y="245" text-anchor="middle" font-size="8" fill="#4a5568">Pin6</text>
  <text x="460" y="258" text-anchor="middle" font-size="8" fill="#1a1a1a" font-weight="bold">5V</text>
  <text x="495" y="258" text-anchor="middle" font-size="8" fill="#1a1a1a" font-weight="bold">SDA</text>
  <text x="530" y="258" text-anchor="middle" font-size="8" fill="#1a1a1a" font-weight="bold">SCL</text>
  <text x="565" y="258" text-anchor="middle" font-size="8" fill="#1a1a1a" font-weight="bold">GND</text>
  <text x="600" y="258" text-anchor="middle" font-size="8" fill="#1a1a1a" font-weight="bold">GND(I2C)</text>
  <text x="635" y="258" text-anchor="middle" font-size="8" fill="#a0aec0" font-weight="bold">NC</text>

  <!-- wires: Nano to TF-Luna -->
  <path d="M210,380 L460,380 L460,230" stroke="#c53030" stroke-width="2" fill="none"/>
  <text x="270" y="375" font-size="11" fill="#c53030">Pin1: 5V</text>

  <path d="M210,165 L495,165 L495,230" stroke="#38a169" stroke-width="2" fill="none"/>
  <text x="270" y="158" font-size="11" fill="#38a169">Pin2: SDA (A4)</text>

  <path d="M210,200 L530,200 L530,230" stroke="#805ad5" stroke-width="2" fill="none"/>
  <text x="270" y="193" font-size="11" fill="#805ad5">Pin3: SCL (A5)</text>

  <path d="M210,420 L565,420 L565,230" stroke="#2d3748" stroke-width="2" fill="none"/>
  <text x="270" y="435" font-size="11" fill="#2d3748">Pin4: GND</text>

  <path d="M210,500 L600,500 L600,230" stroke="#dd6b20" stroke-width="2" fill="none"/>
  <text x="270" y="515" font-size="11" fill="#dd6b20">Pin5: GND (enables I2C mode)</text>

  <text x="635" y="290" text-anchor="middle" font-size="10" fill="#a0aec0" font-style="italic">Pin6: not used</text>

  <!-- Motor Drive Circuit -->
  <text x="800" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Motor Drive Circuit</text>

  <line x1="780" y1="390" x2="780" y2="450" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="765" y1="405" x2="795" y2="405" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="780" y1="390" x2="800" y2="380" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="780" y1="435" x2="800" y2="450" stroke="#1a1a1a" stroke-width="2"/>
  <text x="810" y="385" font-size="12" fill="#1a1a1a">C</text>
  <text x="740" y="410" font-size="12" fill="#1a1a1a">B</text>
  <text x="810" y="455" font-size="12" fill="#1a1a1a">E</text>
  <text x="755" y="485" text-anchor="middle" font-size="12" fill="#1a1a1a">2N2222 / S8050</text>
  <text x="755" y="500" text-anchor="middle" font-size="10" fill="#4a5568">(flat side facing you: E-B-C)</text>

  <rect x="690" y="398" width="40" height="14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="710" y="392" text-anchor="middle" font-size="10" fill="#1a1a1a">220ohm</text>
  <path d="M210,300 L690,300 L690,405 L765,405" stroke="#d69e2e" stroke-width="2" fill="none"/>
  <text x="270" y="313" font-size="11" fill="#d69e2e">D6 PWM signal (Base)</text>

  <circle cx="880" cy="380" r="25" fill="#f6e05e" stroke="#975a16" stroke-width="2"/>
  <text x="880" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">M</text>
  <text x="880" y="420" text-anchor="middle" font-size="11" fill="#1a1a1a">Vibration Motor</text>

  <path d="M880,355 L880,330 L460,330 L460,230" stroke="#c53030" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M880,405 L880,430 L800,380" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <text x="900" y="330" font-size="10" fill="#c53030" opacity="0.8">to 5V (Collector side)</text>

  <line x1="920" y1="360" x2="920" y2="400" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M912,360 L928,360 L920,375 Z" fill="#1a1a1a"/>
  <line x1="912" y1="400" x2="928" y2="400" stroke="#1a1a1a" stroke-width="2"/>
  <text x="935" y="385" font-size="10" fill="#1a1a1a">1N4001</text>
  <path d="M880,355 L920,355 L920,360" stroke="#1a1a1a" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M880,405 L920,405 L920,400" stroke="#1a1a1a" stroke-width="1.5" fill="none" opacity="0.5"/>

  <path d="M800,450 L800,540 L210,460" stroke="#2d3748" stroke-width="2" fill="none"/>
  <text x="500" y="555" font-size="11" fill="#2d3748">GND (common)</text>

  <!-- Legend -->
  <rect x="50" y="580" width="900" height="150" rx="6" fill="#fff" stroke="#cbd5e0" stroke-width="1"/>
  <text x="70" y="605" font-size="13" font-weight="bold" fill="#1a1a1a">Legend / Notes</text>
  <text x="70" y="628" font-size="12" fill="#1a1a1a">TF-Luna Pin 1 → 5V   |   Pin 2 → SDA (A4)   |   Pin 3 → SCL (A5)   |   Pin 4 → GND   |   Pin 5 → GND (I2C mode select)   |   Pin 6 → not used</text>
  <text x="70" y="650" font-size="12" fill="#1a1a1a">Motor: one lead → 5V, other lead → Transistor Collector. Transistor Base → 220Ω resistor → D6. Transistor Emitter → GND.</text>
  <text x="70" y="672" font-size="11.5" fill="#4a5568">Diode (1N4001) sits across the motor, striped end (cathode) toward +5V — absorbs voltage spike when motor switches off.</text>
  <text x="70" y="692" font-size="11.5" fill="#4a5568">Library: TFLI2C by Bud Ryerson. Default I2C address: 0x10.</text>
  <text x="70" y="712" font-size="11.5" fill="#4a5568">Debug tip: fully disconnect the sensor (not just power) when testing — a half-connected device can hang the I2C bus.</text>
</svg>
